<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seven Hills Recovery Dashboard</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1220;
      color: white;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: #111827;
      padding: 20px;
      overflow-y: auto;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
    }

    .sidebar h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .sidebar button {
      width: 100%;
      margin-bottom: 10px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1f2937;
      color: white;
      cursor: pointer;
      text-align: left;
    }

    .sidebar button:hover {
      background: #2563eb;
    }

    .content {
      margin-left: 240px;
      width: calc(100% - 240px);
      padding: 20px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: #1f2937;
      border-radius: 12px;
      padding: 20px;
    }

    .card h3 {
      font-size: 15px;
      margin-bottom: 10px;
      color: #9ca3af;
    }

    .card .value {
      font-size: 34px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      border: 1px solid #374151;
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }

    td[contenteditable="true"] {
      background: #111827;
    }

    input {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #1f2937;
      color: white;
    }

    .button {
      margin-top: 10px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .delete-btn {
      background: #dc2626;
      border: none;
      border-radius: 6px;
      color: white;
      padding: 6px 10px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        position: relative;
        height: auto;
      }

      .content {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h1>Seven Hills</h1>

    <button onclick="showPage('dashboard')">Dashboard</button>
    <button onclick="showPage('receipting')">Receipting</button>
    <button onclick="showPage('sorting')">Sorting</button>
    <button onclick="showPage('styles')">Final Box Count</button>
    <button onclick="showPage('labour')">Labour</button>
    <button onclick="showPage('plan')">Recovery Plan</button>
    <button onclick="showPage('supplies')">Supplies</button>
  </div>

  <div class="content">

    <!-- DASHBOARD -->
    <div id="dashboard" class="page active">
      <h1>Dashboard</h1>

      <div class="cards">
        <div class="card">
          <h3>Total Pallets</h3>
          <div class="value">103</div>
        </div>

        <div class="card">
          <h3>Total Boxes</h3>
          <div class="value">3000</div>
        </div>

        <div class="card">
          <h3>Receipted Pallets</h3>
          <div class="value" id="receiptedTotal">0</div>
        </div>

        <div class="card">
          <h3>Sorted Pallets</h3>
          <div class="value" id="sortedTotal">0</div>
        </div>
      </div>
    </div>

    <!-- RECEIPTING -->
    <div id="receipting" class="page">
      <h1>Receipting</h1>

      <input type="date" id="receiptDate" />
      <input type="number" id="receiptPallets" placeholder="Pallets" />
      <input type="number" id="receiptBoxes" placeholder="Boxes" />

      <button class="button" onclick="addReceipting()">Add Entry</button>

      <table id="receiptingTable">
        <tr>
          <th>Date</th>
          <th>Pallets</th>
          <th>Boxes</th>
          <th>Delete</th>
        </tr>
      </table>
    </div>

    <!-- SORTING -->
    <div id="sorting" class="page">
      <h1>Sorting</h1>

      <input type="date" id="sortDate" />
      <input type="number" id="sortPallets" placeholder="Sorted Pallets" />

      <button class="button" onclick="addSorting()">Add Entry</button>

      <table id="sortingTable">
        <tr>
          <th>Date</th>
          <th>Pallets</th>
          <th>Delete</th>
        </tr>
      </table>
    </div>

    <!-- STYLES -->
    <div id="styles" class="page">
      <h1>Final Box Count</h1>

      <input type="text" id="styleName" placeholder="Style" />
      <input type="number" id="styleBoxes" placeholder="Boxes" />

      <button class="button" onclick="addStyle()">Add Style</button>

      <table id="stylesTable">
        <tr>
          <th>Style</th>
          <th>Boxes</th>
          <th>Delete</th>
        </tr>
      </table>
    </div>

    <!-- LABOUR -->
    <div id="labour" class="page">
      <h1>Labour</h1>

      <input type="date" id="labourDate" />
      <input type="text" id="labourName" placeholder="Staff Name" />
      <input type="number" id="labourHours" placeholder="Hours" />

      <button class="button" onclick="addLabour()">Add Entry</button>

      <table id="labourTable">
        <tr>
          <th>Date</th>
          <th>Name</th>
          <th>Hours</th>
          <th>Delete</th>
        </tr>
      </table>
    </div>

    <!-- RECOVERY PLAN -->
    <div id="plan" class="page">
      <h1>Recovery Plan</h1>

      <table id="planTable">
        <tr>
          <th>Date</th>
          <th>Plan</th>
        </tr>
      </table>
    </div>

    <!-- SUPPLIES -->
    <div id="supplies" class="page">
      <h1>Supplies</h1>

      <input type="text" id="supplyInput" placeholder="Add Supply Item" />

      <button class="button" onclick="addSupply()">Add Supply</button>

      <table id="suppliesTable">
        <tr>
          <th>Item</th>
          <th>Delete</th>
        </tr>
      </table>
    </div>
  </div>

  <script>

    // =========================
    // FIREBASE
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyD9nPDHQpkPgxeQYfe-JVWemQg6CjbCBYM",
      authDomain: "seven-hills-dashboard-e973d.firebaseapp.com",
      projectId: "seven-hills-dashboard-e973d",
      storageBucket: "seven-hills-dashboard-e973d.firebasestorage.app",
      messagingSenderId: "1016653351453",
      appId: "1:1016653351453:web:a2a1f597844adf51ba54f4"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();

    // =========================
    // PAGE NAVIGATION
    // =========================

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });

      document.getElementById(pageId).classList.add('active');
    }

    // =========================
    // DELETE ROW
    // =========================

    function deleteRow(button) {
      button.closest('tr').remove();
    }

    // =========================
    // RECEIPTING
    // =========================

    function addReceipting() {
      const date = document.getElementById('receiptDate').value;
      const pallets = document.getElementById('receiptPallets').value;
      const boxes = document.getElementById('receiptBoxes').value;

      const row = document.getElementById('receiptingTable').insertRow();

      row.innerHTML = `
        <td>${date}</td>
        <td>${pallets}</td>
        <td>${boxes}</td>
        <td><button class="delete-btn" onclick="deleteRow(this)">Delete</button></td>
      `;
    }

    // =========================
    // SORTING
    // =========================

    function addSorting() {
      const date = document.getElementById('sortDate').value;
      const pallets = document.getElementById('sortPallets').value;

      const row = document.getElementById('sortingTable').insertRow();

      row.innerHTML = `
        <td>${date}</td>
        <td>${pallets}</td>
        <td><button class="delete-btn" onclick="deleteRow(this)">Delete</button></td>
      `;
    }

    // =========================
    // STYLES
    // =========================

    function addStyle() {
      const style = document.getElementById('styleName').value;
      const boxes = document.getElementById('styleBoxes').value;

      const row = document.getElementById('stylesTable').insertRow();

      row.innerHTML = `
        <td>${style}</td>
        <td>${boxes}</td>
        <td><button class="delete-btn" onclick="deleteRow(this)">Delete</button></td>
      `;
    }

    // =========================
    // LABOUR
    // =========================

    function addLabour() {
      const date = document.getElementById('labourDate').value;
      const name = document.getElementById('labourName').value;
      const hours = document.getElementById('labourHours').value;

      const row = document.getElementById('labourTable').insertRow();

      row.innerHTML = `
        <td>${date}</td>
        <td>${name}</td>
        <td>${hours}</td>
        <td><button class="delete-btn" onclick="deleteRow(this)">Delete</button></td>
      `;
    }

    // =========================
    // SUPPLIES
    // =========================

    function addSupply() {
      const item = document.getElementById('supplyInput').value;

      const row = document.getElementById('suppliesTable').insertRow();

      row.innerHTML = `
        <td>${item}</td>
        <td><button class="delete-btn" onclick="deleteRow(this)">Delete</button></td>
      `;
    }

    // =========================
    // RECOVERY PLAN
    // =========================

    const recoveryDates = [
      "Monday 25/05/26",
      "Tuesday 26/05/26",
      "Wednesday 27/05/26",
      "Thursday 28/05/26",
      "Friday 29/05/26",
      "Saturday 30/05/26"
    ];

    function buildRecoveryPlan() {
      const table = document.getElementById('planTable');

      recoveryDates.forEach(date => {
        const row = table.insertRow();

        row.innerHTML = `
          <td contenteditable="true">${date}</td>
          <td contenteditable="true"></td>
        `;
      });

      attachRecoveryListeners();
    }

    async function autoSaveRecoveryPlan() {
      const rows = document.querySelectorAll('#planTable tr');

      let data = [];

      rows.forEach((row, index) => {
        if (index === 0) return;

        const cells = row.querySelectorAll('td');

        data.push({
          date: cells[0].innerHTML,
          plan: cells[1].innerHTML
        });
      });

      await db.collection('dashboard')
        .doc('recoveryPlan')
        .set({ data: data });
    }

    function attachRecoveryListeners() {
      document.querySelectorAll('#planTable td').forEach(cell => {
        cell.addEventListener('input', () => {
          autoSaveRecoveryPlan();
        });
      });
    }

    async function loadRecoveryPlan() {
      try {
        const snapshot = await db.collection('dashboard')
          .doc('recoveryPlan')
          .get();

        if (snapshot.exists) {
          const saved = snapshot.data().data;
          const rows = document.querySelectorAll('#planTable tr');

          saved.forEach((item, index) => {
            if (index + 1 >= rows.length) return;

            rows[index + 1].cells[0].innerHTML = item.date;
            rows[index + 1].cells[1].innerHTML = item.plan;
          });
        }
      } catch (error) {
        console.error(error);
      }
    }

    // =========================
    // STARTUP
    // =========================

    buildRecoveryPlan();
    loadRecoveryPlan();

  </script>
</body>
</html>
